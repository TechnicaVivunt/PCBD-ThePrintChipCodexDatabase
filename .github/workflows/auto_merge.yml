name: Auto Merge PRs

on:
  pull_request:
    types:
      - labeled

jobs:
  automerge:
    if: contains(github.event.label.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PRs with auto-merge label
        uses: pascalgn/automerge-action@v0.15.6
        with:
          pull-request-label: auto-merge
          merge-method: squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
