name: Cleanup Merged Branches

on:
  schedule:
    - cron: '0 3 * * 0'  # Runs every Sunday at 3 AM UTC
  workflow_dispatch:     # Allows manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete merged branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --prune
          protected_branches="main database-backend"
          merged_branches=$(gh api repos/${{ github.repository }}/branches --paginate \
            | jq -r '.[].name' \
            | grep -v -E "$(echo $protected_branches | sed 's/ /|/g')" \
            | while read branch; do
                if gh pr list --head "$branch" --state merged --json headRefName | jq -e '.[]'; then
                  echo "$branch"
                fi
              done)

          for branch in $merged_branches; do
            echo "Deleting branch: $branch"
            gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$branch
          done
