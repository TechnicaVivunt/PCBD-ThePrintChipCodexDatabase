name: Assign Issue When Checkboxes Checked

on:
  issues:
    types: [edited]

permissions:
  issues: write
  contents: read

jobs:
  assign-if-checked:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to TechnicaVivunt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checks = [
              "- [x] I have confirmed my URL is valid",
              "- [x] I have confirmed that my URL is a direct link to the manufacturer and not a reseller"
            ];

            const allChecked = checks.every(check => body.includes(check));
            if (!allChecked) {
              console.log("Not all checkboxes are checked. Skipping assignment.");
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: ["TechnicaVivunt"]
            });

            console.log("✅ Issue assigned to TechnicaVivunt.");
