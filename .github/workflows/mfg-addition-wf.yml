name: Assign and Add to Project

on:
  issues:
    types: [edited]

permissions:
  issues: write
  contents: read

jobs:
  process-checkboxes:
    runs-on: ubuntu-latest
    steps:
      - name: Check checkboxes and update project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;
            const issueId = context.payload.issue.node_id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checks = [
              "- [x] I have confirmed my URL is valid",
              "- [x] I have confirmed that my URL is a direct link to the manufacturer and not a reseller"
            ];

            const allChecked = checks.every(check => body.includes(check));
            if (!allChecked) {
              console.log("Not all checkboxes are checked. Skipping.");
              return;
            }

            // Assign issue to TechnicaVivunt
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: ["TechnicaVivunt"]
            });

            // Add issue to GitHub Project (Beta)
            const projectId = "PVT_kwHOA4wOiM4BHBeG"; // ✅ Your confirmed project node ID
            const statusFieldId = "PVTSSF_lAHOA4wOiM4BHBeGzg35fYU"; // ✅ Your Status field ID
            const noActionOptionId = "6a88e033"; // ✅ Your "No Actions Taken" option ID

            const addItemResponse = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId,
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }
            `, {
              projectId: projectId,
              contentId: issueId
            });

            const itemId = addItemResponse.addProjectV2ItemById.item.id;

            // Set the Status field to "No Actions Taken"
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `, {
              projectId: projectId,
              itemId: itemId,
              fieldId: statusFieldId,
              optionId: noActionOptionId
            });

            console.log("✅ Issue assigned and added to project with status 'No Actions Taken'.");
