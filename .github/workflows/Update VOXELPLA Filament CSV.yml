name: Update VOXELPLA Filament CSV

on:
  schedule:
    - cron: "0 0 * * FRI"  # Runs every Friday at 00:00 UTC
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: database-backend
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Save previous CSV
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          if [ -f "$FILE" ]; then
            cp "$FILE" "$FILE.prev"
          fi

      - name: Run scraper
        run: python dbworker/voxelpla_filament_indexer.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compare CSVs
        id: compare
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          PREV="$FILE.prev"

          if [ -f "$PREV" ]; then
            DIFF=$(git --no-pager diff --no-color -- "$FILE")
            echo "$DIFF"
            if [ -n "$DIFF" ]; then
              echo "changes=true" >> $GITHUB_OUTPUT
            else
              echo "changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous CSV found, treating as new file."
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

          ROWS=$(wc -l < "$FILE")
          echo "rows=$ROWS" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.compare.outputs.changes == 'true'
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          git add "$FILE"
          git commit -m "🔄 Update VOXELPLA CSV on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Create PR with unique branch
        if: steps.compare.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "voxelpla-update-$(date +%Y%m%d%H%M%S)"  # unique branch per run
          base: main
          title: "🔄 Automated VOXELPLA Data Update"
          body: |
            This PR was automatically created because new VOXELPLA filament data was detected.
            - Updated CSV: `dbworker/voxel_filament_index.csv`
            - Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          commit-message: "🔄 Update VOXELPLA CSV"
          delete-branch: true

      - name: Notify Discord
        if: steps.compare.outputs.changes == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "VOXELPLA Scraper"
          description: |
            **VOXELPLA Filament Update**
            CSV updated: `dbworker/voxel_filament_index.csv`
            Total rows: ${{ steps.compare.outputs.rows }}
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993
