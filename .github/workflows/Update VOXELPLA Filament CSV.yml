name: Update VOXELPLA Filament CSV

on:
  schedule:
    - cron: "0 0 * * FRI"  # Runs every Friday at 00:00 UTC
  workflow_dispatch:       # Allow manual triggering

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for PR creation and diffing

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      # 4️⃣ Run the scraper
      - name: Run VOXELPLA scraper
        run: |
          python dbworker/voxelpla_filament_indexer.py

      # 5️⃣ Configure Git for commits
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

- name: Commit changes (if any)
  id: commit
  run: |
    FILE="dbworker/voxel_filament_index.csv"
    
    echo "Number of rows in CSV:"
    ROWS=$(wc -l < "$FILE")
    echo "rows=$ROWS" >> $GITHUB_OUTPUT

    echo "Checking for changes..."
    git add "$FILE"

    # Show diff in logs
    git diff --cached "$FILE" || echo "No staged changes detected"

    # Only commit if there is a diff
    if ! git diff --cached --quiet "$FILE"; then
      git commit -m "🔄 Update VOXELPLA CSV on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      git push origin database-backend
      echo "changes=true" >> $GITHUB_OUTPUT
    else
      echo "No changes detected — nothing to commit."
      echo "changes=false" >> $GITHUB_OUTPUT
    fi


      # 7️⃣ Count CSV rows for Discord
      - name: Count CSV rows
        id: csvcount
        if: steps.commit.outputs.changes == 'true'
        run: |
          ROWS=$(tail -n +2 dbworker/voxelpla_filament_index.csv | wc -l)
          echo "rows=$ROWS" >> $GITHUB_OUTPUT

      # 8️⃣ Create PR to main if changes
      - name: Create PR to main
        if: steps.commit.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.commit.outputs.branch }}
          base: main
          title: "🔄 Automated VOXELPLA Data Update"
          body: |
            This PR was automatically created because new VOXELPLA filament data was detected.
            - Updated CSV: `dbworker/voxelpla_filament_index.csv`
            - Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          commit-message: "🔄 Update VOXELPLA CSV"
          delete-branch: true   # Delete temp branch after PR merge

      # 9️⃣ Notify Discord if CSV changed
      - name: Notify Discord
        if: steps.commit.outputs.changes == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "VOXELPLA Scraper"
          description: |
            **VOXELPLA Filament Update**
            CSV updated: `dbworker/voxelpla_filament_index.csv`.
            Total variants fetched: ${{ steps.csvcount.outputs.rows }}.
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993

