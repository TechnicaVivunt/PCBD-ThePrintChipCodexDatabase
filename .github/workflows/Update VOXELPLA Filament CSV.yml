name: Update VOXELPLA CSV

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check-changes.outputs.changes }}
      pr-branch: ${{ steps.set-pr-branch.outputs.branch }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate VOXELPLA CSV
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          PREV="$FILE.prev"

          # Save previous version if it exists
          if [ -f "$FILE" ]; then
            cp "$FILE" "$PREV"
          fi

          # Regenerate CSV
          python dbworker/voxelpla_filament_indexer.py

          ROWS=$(wc -l < "$FILE")
          echo "rows=$ROWS" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          if [ ! -f "$FILE.prev" ] || ! cmp -s "$FILE" "$FILE.prev"; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set PR branch name
        id: set-pr-branch
        run: |
          branch="voxelpla-update-$(date -u +%Y%m%d%H%M%S)"
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B database-backend
          git add "$FILE"
          git commit -m "🔄 Update VOXELPLA CSV on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push -u origin database-backend

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.set-pr-branch.outputs.branch }}
          base: main
          title: "🔄 Automated VOXELPLA Data Update"
          body: |
            This PR was automatically created because new VOXELPLA filament data was detected.
            - Updated CSV: `dbworker/voxel_filament_index.csv`
            - Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          commit-message: "🔄 Update VOXELPLA CSV"
          delete-branch: true
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "TechnicaVivunt <59510408+TechnicaVivunt@users.noreply.github.com>"
          signoff: false
          draft: false

      - name: Notify Discord with changes
        if: steps.compare.outputs.changes == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "VOXELPLA Scraper"
          description: |
            **VOXELPLA Filament Update**
            CSV updated: `dbworker/voxel_filament_index.csv`
            Total rows: ${{ steps.compare.outputs.rows }}
            Changes:
            ```
            ${{ steps.compare.outputs.diff }}
            ```
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993

