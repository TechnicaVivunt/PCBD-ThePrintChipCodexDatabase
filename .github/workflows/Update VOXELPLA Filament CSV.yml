name: Update VOXELPLA Filament CSV

on:
  schedule:
    - cron: "0 0 * * FRI"
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: database-backend
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python dbworker/voxelpla_filament_indexer.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes (if any)
        id: commit
        run: |
          FILE="dbworker/voxel_filament_index.csv"
          if [ ! -f "$FILE" ] || ! git diff --quiet "$FILE"; then
            git add "$FILE"
            git commit -m "🔄 Update VOXELPLA CSV on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin database-backend
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected — nothing to commit."
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          ROWS=$(wc -l < "$FILE")
          echo "rows=$ROWS" >> $GITHUB_OUTPUT

      - name: Generate PR branch name
        id: branch
        run: |
          BRANCH="voxelpla-update-$(date +%Y%m%d%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create or update PR to main
        if: steps.commit.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch }}
          base: main
          title: "🔄 Automated VOXELPLA Data Update"
          body: |
            This PR was automatically created because new VOXELPLA filament data was detected.
            - Updated CSV: `dbworker/voxel_filament_index.csv`
            - Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          commit-message: "🔄 Update VOXELPLA CSV"
          delete-branch: true
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: TechnicaVivunt <59510408+TechnicaVivunt@users.noreply.github.com>
          signoff: false
          draft: false

      - name: Notify Discord if changed
        if: steps.commit.outputs.changes == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "VOXELPLA Scraper"
          description: |
            **VOXELPLA Filament Update**
            CSV updated in `dbworker/voxel_filament_index.csv`.
            Total variants fetched: ${{ steps.commit.outputs.rows }}.
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993
