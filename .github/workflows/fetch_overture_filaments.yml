name: Fetch Overture Filaments

on:
  push:
    branches:
      - database-backend
  schedule:
    - cron: "0 0 * * FRI"  # Runs every day at 9 AM UTC
  workflow_dispatch:

jobs:
  fetch_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filament script
        id: fetch
        run: |
          output=$(python dbworker/fetch_overture_filaments.py)
          echo "$output" > output.json
          ROWS=$(echo "$output" | jq -r '.rows')
          CHANGED=$(echo "$output" | jq -r '.changed')
          echo "rows=$ROWS" >> $GITHUB_OUTPUT
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Create Pull Request if changed
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update Overture filament CSV [ci skip]"
          branch: update/overture-filaments
          base: main
          title: "Update Overture filament CSV"
          body: |
            This PR updates `dbworker/overture_filament_index.csv`.
            Total variants fetched: ${{ steps.fetch.outputs.rows }}.
            Generated automatically by GitHub Actions.

      - name: Notify Discord if changed
        if: steps.fetch.outputs.changed == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "Overture Scraper"
          description: |
            **Overture Filament Update**
            CSV updated in `dbworker/overture_filament_index.csv`.
            Total variants fetched: ${{ steps.fetch.outputs.rows }}.
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993
