name: Sync from 3DFilamentProfiles

on:
  schedule:
    - cron: "0 9 * * MON"  # weekly
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process first N brands (leave blank for full run)"
        required: false
        default: ""

jobs:
  sync:
    # Was ubuntu-latest (GitHub-hosted). Switched to a self-hosted runner
    # because GitHub's shared runner IP ranges get 429'd by
    # 3dfilamentprofiles.com's bot protection even with correct browser
    # headers -- confirmed via a real failed run (urllib3
    # "too many 429 error responses" on the very first request). This
    # isn't fixable with more retries: if it's IP-reputation-based rather
    # than about our own request rate, backoff on our end doesn't help.
    # A self-hosted runner uses a trusted IP instead (same one manual
    # runs already work from) -- see Settings > Actions > Runners to
    # register one. The runner's host machine must be on and the runner
    # service running when the weekly schedule fires.
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: pip install requests pyyaml

      # --resume is always passed: if dbworker/.sync_checkpoint.jsonl was
      # committed by a previous partial run, this picks up where it left
      # off; if no checkpoint exists (the normal case), --resume is a
      # no-op and this is just a fresh full run.
      #
      # continue-on-error: the script exits 1 when some brands fail
      # without --allow-partial, which is expected/handled behavior
      # (checkpoint preserved for next run), not a workflow failure.
      - name: Run full sync
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          ARGS="--delay 0.5 --resume"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python dbworker/run_full_sync.py $ARGS

      - name: Configure git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Checkpoint bookkeeping is committed straight to main (no PR) so a
      # partial run's progress survives to the next scheduled run. This
      # is internal state, not filament data, so it never opens a PR by
      # itself -- only actual record changes (below) do that.
      - name: Persist partial-run checkpoint, if any
        shell: bash
        run: |
          if [ -f dbworker/.sync_checkpoint.jsonl ]; then
            git add dbworker/.sync_checkpoint.jsonl dbworker/.sync_done_brands.txt
            if ! git diff --cached --quiet; then
              git commit -m "Save partial sync checkpoint"
              git push origin HEAD:main
            fi
          fi

      # Only these three files count as "records changed" -- a PR opens
      # if and only if the actual filament data or manufacturer registry
      # differs from what's on main. A partial run with no new filaments
      # found yet produces no PR at all. `git add` only files that
      # actually exist -- the very first run (or one that failed before
      # writing anything) has none yet, and `git add` on a nonexistent
      # path is a hard error, not a no-op.
      - name: Detect record changes
        id: detect
        shell: bash
        run: |
          FILES_TO_CHECK="PCDB-Database.csv PCDB-PTouch-Import.csv registry/manufacturers.csv"
          EXISTING_FILES=""
          for f in $FILES_TO_CHECK; do
            if [ -f "$f" ]; then
              EXISTING_FILES="$EXISTING_FILES $f"
            fi
          done
          if [ -z "$EXISTING_FILES" ]; then
            echo "None of the expected output files exist yet -- sync likely failed before writing anything."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add $EXISTING_FILES
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync filament data from 3DFilamentProfiles"
          title: "3DFilamentProfiles sync${{ steps.sync.outcome == 'failure' && ' (partial -- some brands pending)' || '' }}"
          body: |
            Auto-generated by the weekly sync workflow.
            Source: https://3dfilamentprofiles.com
            ${{ steps.sync.outcome == 'failure' && 'Some brands failed to fetch this run -- checkpoint saved, next scheduled run resumes automatically.' || 'Full run completed successfully.' }}
          branch: 3dfp-sync-update
          base: main
          delete-branch: true
          labels: auto-merge
