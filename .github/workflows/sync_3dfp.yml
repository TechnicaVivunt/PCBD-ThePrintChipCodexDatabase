name: Sync from 3DFilamentProfiles

on:
  schedule:
    - cron: "0 9 * * MON"  # weekly -- this hits ~1,100 pages on someone's
                           # personal server each run; don't increase
                           # frequency without checking in with them first
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process first N brands (leave blank for full run)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      # --resume is always passed: if dbworker/.sync_checkpoint.jsonl was
      # committed by a previous partial run, this picks up where it left
      # off; if no checkpoint exists (the normal case -- last run finished
      # cleanly), --resume is a no-op and this is just a fresh full run.
      #
      # continue-on-error: the script exits 1 when some brands fail
      # without --allow-partial, which is expected/handled behavior here
      # (checkpoint preserved for next week), not a workflow failure.
      - name: Run full sync
        id: sync
        continue-on-error: true
        run: |
          ARGS="--delay 0.5 --resume"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python dbworker/run_full_sync.py $ARGS

      - name: Stage and detect changes
        id: detect
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PCDB-Database.csv PCDB-PTouch-Import.csv registry/manufacturers.csv \
                  dbworker/.sync_checkpoint.jsonl dbworker/.sync_done_brands.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync filament data from 3DFilamentProfiles"
          title: "3DFilamentProfiles sync${{ steps.sync.outcome == 'failure' && ' (partial -- some brands pending)' || '' }}"
          body: |
            Auto-generated by the sync workflow.
            Source: https://3dfilamentprofiles.com
            ${{ steps.sync.outcome == 'failure' && 'Some brands failed to fetch this run -- checkpoint committed, next scheduled run will resume automatically.' || 'Full run completed successfully.' }}
          branch: 3dfp-sync-update
          base: main
          delete-branch: true
