name: Update README Manufacturer Table

on:
  push:
    paths:
      - dbworker/update_master.py
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run update script
        run: python dbworker/update_readme.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Update manufacturer table in README.md"
          title: "Auto-update manufacturer table"
          body: "This PR updates the manufacturer mapping table in README.md based on dbworker/update_master.py"
          branch: auto/update-manufacturer-table
          base: main
          delete-branch: true
          labels: auto-merge
          assignees: TechnicaVivunt
          reviewers: TechnicaVivunt
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.15.6
        with:
          merge-method: squash
          pull-request-title: "Auto-update manufacturer table"
          pull-request-label: auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
