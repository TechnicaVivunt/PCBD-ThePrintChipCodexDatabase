name: Update Master CSV on PR

on:
  pull_request:
    paths:
      - 'dbworker/*.csv'
  workflow_dispatch:
jobs:
  update-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run enrichment script
        run: python dbworker/update_master.py

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create temp branch
        run: |
          git checkout -b enrich-csv-${{ github.run_id }}
          git add PCDB-Database.csv
          git commit -m "Update master CSV from PR #${{ github.event.number }}"
          git push origin enrich-csv-${{ github.run_id }}

      - name: Create pull request to main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source: enrich-csv-${{ github.run_id }}
          destination: main
          title: "Auto-update master CSV from PR #${{ github.event.number }}"
          body: "This PR was automatically generated to update PCDB-Database.csv based on changes in dbworker."
