name: Merge CSV on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-csv:
    runs-on: ubuntu-latest

    # Only run if the PR is from the 'database-backend' branch into 'main'
    if: github.head_ref == 'database-backend' && github.base_ref == 'main'

    steps:
      # Step 1: Checkout PR branch fully
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0  # ensures full history for git diff

      # Step 2: Fetch main branch for comparison
      - name: Fetch main branch
        run: git fetch origin main

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # Step 5: Detect new or modified CSVs in dbworker folder
      - name: Detect changed CSVs
        id: changed_csvs
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD dbworker/ | grep '\.csv$' || true)
          echo "changed_csvs=$CHANGED" >> $GITHUB_OUTPUT
          echo "Detected changed CSVs:"
          echo "$CHANGED"

      # Step 6: Merge each changed CSV into PCDB-Database.csv
      - name: Merge changed CSVs
        if: steps.changed_csvs.outputs.changed_csvs != ''
        run: |
          echo "Processing changed CSVs:"
          for csv in ${{ steps.changed_csvs.outputs.changed_csvs }}; do
              echo "Merging $csv into PCDB-Database.csv"
              python merge_and_code.py "$csv"
          done

      # Step 7: Commit and push updated PCDB-Database.csv
      - name: Commit updated PCDB-Database.csv
        if: steps.changed_csvs.outputs.changed_csvs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PCDB-Database.csv
          git diff --cached --quiet || git commit -m "Update PCDB-Database.csv with new entries [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.head_ref }}

      # Step 8: Comment on the PR to explain its purpose
      - name: Comment on Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const changedCSVs = `${{ steps.changed_csvs.outputs.changed_csvs }}`.trim();

            let body = `🧩 **Automated Database Update**\n\n`;
            body += `This PR was automatically generated by the **database-backend** workflow. `;
            body += `It merges new or updated filament data into \`PCDB-Database.csv\`.\n\n`;

            if (changedCSVs) {
              body += `**Detected CSV files:**\n`;
              body += changedCSVs.split(/\s+/).map(f => `- \`${f}\``).join('\n');
            } else {
              body += `No new CSV files were detected in this run.`;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body
            });
