name: Update Filament Data

on:
  schedule:
    - cron: "0 9 * * MON,FRI"  # 9am UTC Mondays and Fridays
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated manufacturer keys (blank = all)"
        required: false
        default: ""

jobs:
  scrape:
    strategy:
      fail-fast: false   # one manufacturer breaking shouldn't block the rest
      matrix:
        manufacturer: [polymaker, hatchbox, voxelpla, overture, coex3d, bambu, prusa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Skip if not selected
        if: github.event.inputs.only != '' && !contains(github.event.inputs.only, matrix.manufacturer)
        run: echo "Skipping ${{ matrix.manufacturer }}" && exit 0

      - name: Run indexer
        run: python dbworker/run_indexers.py --only ${{ matrix.manufacturer }}

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- dbworker/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit CSV
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbworker/*.csv
          git commit -m "Update ${{ matrix.manufacturer }} filament data"
          git push origin HEAD:refs/heads/data-update-${{ matrix.manufacturer }} --force

      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ${{ matrix.manufacturer }} filament data"
          title: "Automated ${{ matrix.manufacturer }} data update"
          body: "Auto-generated by the update_filaments workflow."
          base: main
          branch: data-update-${{ matrix.manufacturer }}
          delete-branch: true
          labels: auto-merge

      - name: Notify Discord
        if: steps.check.outputs.changed == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "${{ matrix.manufacturer }} Scraper"
          description: |
            **${{ matrix.manufacturer }} filament data updated**
            Check the repo for details: https://github.com/${{ github.repository }}
          color: 3066993

  # Runs once, after every manufacturer's scrape job finishes, instead of
  # each manufacturer's workflow separately triggering the merge on push.
  merge-master:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests pyyaml

      - name: Merge into master CSV
        run: python dbworker/update_master.py

      - name: Detect changes
        id: detect
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PCDB-Database.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update master database"
          title: "Auto-update master database"
          body: "Auto-generated by the update_filaments workflow."
          branch: merge-master-update
          base: main
          add-paths: PCDB-Database.csv
          delete-branch: true
